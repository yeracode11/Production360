services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: production360-db
    environment:
      POSTGRES_USER: production360
      POSTGRES_PASSWORD: production360
      POSTGRES_DB: production360
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production360 -d production360"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
