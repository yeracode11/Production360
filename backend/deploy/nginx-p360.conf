# Nginx: только HTTP. После cp на сервер — certbot --nginx -d p360.darasoft.kz
server {
    listen 80;
    server_name p360.darasoft.kz;

    # Выгрузки номенклатуры из 1С бывают больше дефолтного 1 МБ.
    client_max_body_size 20m;

    # Рекомендуется: /sync/* только с IP сервера 1С.
    # Раскомментируйте и укажите IP (тот же proxy_* набор, что ниже).
    # location /sync/ {
    #     allow 1.2.3.4;   # IP сервера 1С
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Authorization $http_authorization;
    #     proxy_read_timeout 120s;
    # }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Без этого nginx может не передать Authorization до uvicorn.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
}
